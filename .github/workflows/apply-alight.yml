name: 一次性接入原版 Skills 增量
on:
  push:
    branches: [rework/alight-baseline-skills]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'yzin-17/codex-monitor' && contains(github.event.head_commit.message, '[apply-alight]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      head: ${{ steps.apply.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: 收尾身份隔离与构建可重复性
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          branch=rework/alight-baseline-skills
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/finalize-alight-integration.py
          git add -u
          git config user.name 'codex-monitor maintenance'
          git config user.email '30586807+yzin-17@users.noreply.github.com'
          git commit -m 'fix: isolate derived caches and preserve source icon after packaging'
          git push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: 原版与增量校验
        run: |
          swift --version
          python3 scripts/verify-alight-baseline.py
      - name: 原版回归、Skills 测试与双架构打包
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-app.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -180 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E 'Executed [0-9]+ tests|Test run with|All regression|Built |error:' "$RUNNER_TEMP/build.log" || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          python3 scripts/verify-alight-baseline.py
          git diff --exit-code
          ls -lh dist/*.dmg
          git archive --format=zip HEAD > dist/codex-monitor-alight-source.zip
      - name: 验证产物
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-monitor-alight-validation
          path: |
            dist/*.dmg
            dist/codex-monitor-alight-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: 保留构建日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alight-build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore
