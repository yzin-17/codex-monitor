                range: 0...24,
                suffix: "pt"
            )
''',
              '''            appearanceSlider("HUD 背景透明度", value: $preferences.value.hudTransparency, range: 0...1)
            numberField(
                "HUD 圆角",
                value: Binding(get: { preferences.value.cornerRadius }, set: { preferences.value.cornerRadius = $0 }),
                range: 0...24,
