name: Apply HUD adaptive width fixes

on:
  push:
    branches: [fix/hud-adaptive-width-and-browser-login-test]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: adapt HUD width and stabilize browser login cancellation test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/hud-adaptive-width-and-browser-login-test
          persist-credentials: true
      - name: Apply focused changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1-3: HUD appearance settings and clearer numeric fields.
          replace_once(
              "Sources/CodexNotch/HUDLayoutEditorView.swift",
