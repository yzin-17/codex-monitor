name: macOS 构建与交互回归
on:
  push:
    branches: [main, fix/hud-layout-status-titles]
  pull_request:
permissions:
  contents: write
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: 应用并提交四项界面修复
        if: github.ref == 'refs/heads/fix/hud-layout-status-titles'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 1:
                  p.write_text(text.replace(old, new, 1))
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"{path}: expected one old match or already-applied replacement, got {count}")

          replace_once(
              'Sources/CodexNotch/HUDContentView.swift',
              '''            HStack(alignment: .firstTextBaseline, spacing: 4) {
                if !value.label.isEmpty {
                    Text(value.label)
                        .font(.system(size: max(7, fontSize - 1.5), weight: .semibold))
                        .foregroundStyle(MonitorTheme.textSecondary)
                }
                Text(value.value).foregroundStyle(value.tone.color)
            }
            .lineLimit(1)
''',
              '''            HStack(alignment: .firstTextBaseline, spacing: 4) {
                if !value.label.isEmpty {
                    Text(value.label)
                        .font(.system(size: max(7, fontSize - 1.5), weight: .semibold))
                        .foregroundStyle(MonitorTheme.textSecondary)
                        .fixedSize(horizontal: true, vertical: false)
                }
                Text(value.value)
                    .foregroundStyle(value.tone.color)
                    .fixedSize(horizontal: true, vertical: false)
            }
            .fixedSize(horizontal: true, vertical: false)
'''
          )
          replace_once(
              'Sources/CodexNotch/HUDLayoutEditorView.swift',
              '''            Divider()

            Picker("新增控件绑定到", selection: $preferences.value.sourceID) {
''',
              '''            Picker("新增控件绑定到", selection: $preferences.value.sourceID) {
'''
          )
          replace_once(
              'Sources/CodexNotch/NotchIslandView.swift',
              '''                            VStack(spacing: 12) {
                                    PerformancePanelView(viewModel: performanceViewModel)
                                    PublicInsightCard(source: .openAIStatus, store: publicInsights)
                                }
''',
              '''                            VStack(spacing: 12) {
                                    PerformancePanelView(viewModel: performanceViewModel)
                                    Text("服务器状态")
                                        .font(.system(size: 12, weight: .semibold))
                                        .foregroundStyle(MonitorTheme.textPrimary)
                                        .frame(maxWidth: .infinity, alignment: .leading)
                                        .padding(.top, 2)
                                    PublicInsightCard(source: .openAIStatus, store: publicInsights)
                                }
'''
          )
          replace_once(
              'Sources/CodexNotch/NotchIslandView.swift',
              '''                            Text(task.title)
                                .font(.system(size: 11, weight: .bold))
                                .foregroundStyle(.white.opacity(0.92))
                                .lineLimit(isExpanded ? 3 : 2).truncationMode(.tail)
                                .fixedSize(horizontal: false, vertical: true)
''',
              '''                            Text(task.title)
                                .font(.system(size: 11, weight: .bold))
                                .foregroundStyle(.white.opacity(0.92))
                                .lineLimit(nil)
                                .fixedSize(horizontal: false, vertical: true)
                                .layoutPriority(1)
'''
          )

          # Remove the one-shot helper workflow and restore this production CI definition in the commit.
          helper = Path('.github/workflows/apply-ui-polish.yml')
          if helper.exists(): helper.unlink()
          Path('.github/workflows/ci.yml').write_text('''name: macOS 构建与交互回归
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 回归、原生界面与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui
          swift --version
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -180 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          for page in codex performance skills codexRadar conversation-costs hud-menu-bar hud-layout codex-accounts hud-fixed-status hud-status-only remoteCodex resetPrediction cli-resume; do
            test -s ".baseline-output/ui/$page.png"
          done
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
          ls -lh dist
      - name: 保存原生截图、日志与安装包
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-monitor-native
          path: |
            .baseline-output/ui/*.png
            .baseline-output/build.log
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
''')
          PY
          git config user.name "yzin"
          git config user.email "30586807+yzin-17@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: polish HUD numbers, layout, status and titles"
          git push origin HEAD:fix/hud-layout-status-titles
      - name: 回归、原生界面与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui
          swift --version
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -180 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          for page in codex performance skills codexRadar conversation-costs hud-menu-bar hud-layout codex-accounts hud-fixed-status hud-status-only remoteCodex resetPrediction cli-resume; do
            test -s ".baseline-output/ui/$page.png"
          done
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
      - name: 保存原生截图、日志与安装包
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-monitor-native
          path: |
            .baseline-output/ui/*.png
            .baseline-output/build.log
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
