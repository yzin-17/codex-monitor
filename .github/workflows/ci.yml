name: macOS 原版与增量验证
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 工具链与原版一致性
        run: |
          swift --version
          python3 scripts/verify-alight-baseline.py
      - name: 原版回归、Skills 测试与双架构打包
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-app.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -180 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E 'Executed [0-9]+ tests|Test run with|All regression|Built |error:' "$RUNNER_TEMP/build.log" || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          python3 scripts/verify-alight-baseline.py
          git diff --exit-code
          ls -lh dist/*.dmg
      - name: 原版静态测试数据窗口预览
        id: ui_smoke
        continue-on-error: true
        run: ./scripts/ci-ui-smoke.sh
      - name: 记录图形环境验证状态
        if: always()
        env:
          UI_OUTCOME: ${{ steps.ui_smoke.outcome }}
        run: echo "图形环境冒烟结果：$UI_OUTCOME；不等同人工视觉验收。" >> "$GITHUB_STEP_SUMMARY"
      - name: 验证安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-monitor-alight-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7
          if-no-files-found: error
      - name: 构建日志与可用的窗口预览
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ui-preview.png
            ${{ runner.temp }}/ui-smoke.log
          retention-days: 7
          if-no-files-found: ignore
