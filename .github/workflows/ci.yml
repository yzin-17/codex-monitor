name: macOS 原版与增量验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    if: "!contains(github.event.head_commit.message, '[import-alight]')"
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 工具链
        run: swift --version
      - name: 原版与增量测试、构建
        run: |
          if [[ -f scripts/verify-alight-baseline.py ]]; then python3 scripts/verify-alight-baseline.py; fi
          if [[ -f scripts/build-app.sh ]]; then ./scripts/build-app.sh; else ./scripts/build.sh; fi
      - name: 产物信息
        run: ls -lh dist
