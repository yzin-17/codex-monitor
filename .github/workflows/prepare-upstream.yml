name: 准备已固定的参考源码
on:
  push:
    branches: [fix/alight-baseline-20260910]
    paths: [.github/workflows/prepare-upstream.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取公开源码的固定提交（不执行上游代码）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          git clone --quiet https://github.com/ALight777/codex-monitor.git alight
          git -C alight checkout --quiet --detach ec9363d56a3692903f5ccb7462df2a0fbafc7297
          test "$(git -C alight rev-parse HEAD)" = ec9363d56a3692903f5ccb7462df2a0fbafc7297
          git -C alight archive --format=tar.gz HEAD > output/alight.tar.gz
          git clone --quiet https://github.com/jackiemingnew/codex-monitor-macos.git jackie
          git -C jackie checkout --quiet --detach 6cd6c00aa7327a79a8b4256cf8ec2573375832f3
          test "$(git -C jackie rev-parse HEAD)" = 6cd6c00aa7327a79a8b4256cf8ec2573375832f3
          git -C jackie archive --format=tar.gz HEAD > output/jackie.tar.gz
          sha256sum output/*.tar.gz > output/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-upstream-sources
          path: output/
          retention-days: 1
          if-no-files-found: error
