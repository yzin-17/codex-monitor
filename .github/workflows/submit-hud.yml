name: 菜单栏浮窗与 Codex 账号验证
on:
  push:
    branches: [feat/hud-layout-providers-20260910]
permissions:
  contents: read
concurrency:
  group: hud-correction
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[hud-apply]')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 应用源码改动
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,lzma,os
          from pathlib import Path
          parts = sorted(Path('tools/hud-transfer').glob('*'))
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          Path(os.environ['RUNNER_TEMP'], 'hud.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/hud.patch"
          git apply --index "$RUNNER_TEMP/hud.patch"
          if test -f tools/hud-fixes.py; then python3 tools/hud-fixes.py; git rm tools/hud-fixes.py; fi
          git rm -r tools/hud-transfer
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE="$(git write-tree)"
          CANDIDATE="$(printf '%s\n' 'feat: add compact floating HUD, anchored reveal and Codex-only accounts' | git commit-tree "$TREE" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-hud "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/validated" .baseline-output/ui
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 测试、原生界面与双架构打包
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -180 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          for page in codex performance skills codexRadar conversation-costs hud-menu-bar hud-layout codex-accounts; do test -s ".baseline-output/ui/$page.png"; done
          test -s dist/codex-monitor-0.3.0-arm64.dmg
          test -s dist/codex-monitor-0.3.0-amd64.dmg
          git diff --quiet
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-hud
      - name: 保存原生截图、构建日志与安装包
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hud-native
          path: |
            .baseline-output/ui/*.png
            .baseline-output/build.log
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: 保存经过验证的源码
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-hud
          path: ${{ runner.temp }}/validated/
          retention-days: 2
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-hud
          path: ${{ runner.temp }}/validated
      - name: 快进功能分支
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-hud:refs/remotes/validated/hud
          test "$(git ls-remote origin refs/heads/feat/hud-layout-providers-20260910 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/feat/hud-layout-providers-20260910"
