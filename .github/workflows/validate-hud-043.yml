name: 0.4.3 HUD 布局与外观回归
on:
  push:
    branches: [feat/hud-layout-sources-043-20260911]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 应用 0.4.3 HUD 改动
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui "$RUNNER_TEMP/validated"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1/2/3: 数字输入、10% 默认透明度、自定义 HUD 圆角所需持久配置。
          pref = 'Sources/CodexNotch/HUDPreferences.swift'
          replace_once(pref,
          '''    var hudOpacity: Double = 0.985
              var panelOpacity: Double = 0.985
              var animation: MonitorPanelAnimation = .anchoredReveal''',
          '''    var hudOpacity: Double = 0.90
              var panelOpacity: Double = 0.90
              var hudCornerRadius: Double? = 10
              var animation: MonitorPanelAnimation = .anchoredReveal''')
          replace_once(pref,
          '''    var panelTransparency: Double {
                  get { 1 - normalized.panelOpacity }
                  set { panelOpacity = 1 - min(0.65, max(0, newValue.isFinite ? newValue : 0)) }
              }
              var normalized: Self {''',
          '''    var panelTransparency: Double {
                  get { 1 - normalized.panelOpacity }
                  set { panelOpacity = 1 - min(0.65, max(0, newValue.isFinite ? newValue : 0)) }
              }
              var cornerRadius: Double {
                  get {
                      let value = hudCornerRadius ?? 10
                      return value.isFinite ? min(24, max(0, value)) : 10
                  }
                  set { hudCornerRadius = newValue.isFinite ? min(24, max(0, newValue)) : 10 }
              }
              var normalized: Self {''')
          replace_once(pref,
          '''        copy.hudOpacity = hudOpacity.isFinite ? min(1, max(0, hudOpacity)) : 0.985
                  copy.panelOpacity = panelOpacity.isFinite ? min(1, max(0.35, panelOpacity)) : 0.985
                  copy.layout = layout.normalized''',
          '''        copy.hudOpacity = hudOpacity.isFinite ? min(1, max(0, hudOpacity)) : 0.90
                  copy.panelOpacity = panelOpacity.isFinite ? min(1, max(0.35, panelOpacity)) : 0.90
                  copy.hudCornerRadius = cornerRadius
                  copy.layout = layout.normalized''')
          replace_once(pref,
          '''            defaults.set(1, forKey: "hudNeutralPaletteVersion")
                  }
              }
          }''',
          '''            defaults.set(1, forKey: "hudNeutralPaletteVersion")
                  }
                  // 0.4.3：仅迁移仍处于上一版默认值的透明度；用户主动调整过的值保持不变。
                  if defaults.integer(forKey: "hudAppearanceDefaultsVersion") < 2 {
                      var migrated = value
                      if abs(migrated.hudOpacity - 0.985) < 0.0001 { migrated.hudOpacity = 0.90 }
                      if abs(migrated.panelOpacity - 0.985) < 0.0001 { migrated.panelOpacity = 0.90 }
                      if migrated.hudCornerRadius == nil { migrated.hudCornerRadius = 10 }
                      value = migrated.normalized
                      if let data = try? JSONEncoder().encode(value) { defaults.set(data, forKey: Self.key) }
                      defaults.set(2, forKey: "hudAppearanceDefaultsVersion")
                  }
              }
          }''')

          # 圆角渲染使用用户配置。
          replace_once('Sources/CodexNotch/HUDContentView.swift',
          '''        .clipShape(RoundedRectangle(cornerRadius: menuBar ? 5 : 14))''',
          '''        .clipShape(RoundedRectangle(cornerRadius: CGFloat(preferences.value.normalized.cornerRadius), style: .continuous))''')

          # 4: 新增控件时直接把当前选中来源编码进控件 token；同一指标允许分别绑定多个账号。
          model = 'Sources/CodexNotch/HUDLayoutModel.swift'
          replace_once(model,
          '''    func inserting(_ metric: HUDMetric, row: Int, before: HUDMetric? = nil) -> Self {
                  guard metric != .state, metric != .conditional else { return normalized }
                  var next = normalized
                  if metric != .space && metric != .separatorDot {
                      next.lines = next.lines.map { $0.filter { $0 != metric.rawValue } }
                  }
                  let row = min(1, max(0, row)); while next.lines.count <= row { next.lines.append([]) }
                  guard next.lines[row].count < Self.maximumItemsPerLine else { return self }
                  let index = before.flatMap { wanted in next.lines[row].firstIndex(where: { HUDMetric.parse($0) == wanted }) } ?? next.lines[row].count
                  next.lines[row].insert(metric == .space ? "space:8" : metric.rawValue, at: index)
                  return next.normalized
              }''',
          '''    func inserting(_ metric: HUDMetric, row: Int, before: HUDMetric? = nil, sourceID: String? = nil) -> Self {
                  guard metric != .state, metric != .conditional else { return normalized }
                  var next = normalized
                  let raw = metric == .space ? "space:8" : HUDLayoutToken.applying(sourceID: sourceID, to: metric.rawValue)
                  if metric != .space && metric != .separatorDot {
                      next.lines = next.lines.map { $0.filter { $0 != raw } }
                  }
                  let row = min(1, max(0, row)); while next.lines.count <= row { next.lines.append([]) }
                  guard next.lines[row].count < Self.maximumItemsPerLine else { return self }
                  let index = before.flatMap { wanted in next.lines[row].firstIndex(where: { HUDMetric.parse($0) == wanted }) } ?? next.lines[row].count
                  next.lines[row].insert(raw, at: index)
                  return next.normalized
              }''')
          replace_once(model,
          '''    func addingConditional(_ rule: HUDConditional, id: String = UUID().uuidString) -> Self {''',
          '''    func addingConditional(_ rule: HUDConditional, id: String = UUID().uuidString, sourceID: String? = nil) -> Self {''')
          replace_once(model,
          '''        next.conditionals[id] = rule.normalized; next.lines[row].append("conditional:" + id)
                  return next.normalized''',
          '''        next.conditionals[id] = rule.normalized
                  next.lines[row].append(HUDLayoutToken.applying(sourceID: sourceID, to: "conditional:" + id))
                  return next.normalized''')

          editor = Path('Sources/CodexNotch/HUDLayoutEditorView.swift')
          s = editor.read_text()
          s = s.replace('Group { presentationSection; sourceSection; layoutSection }', 'Group { presentationSection; layoutSection }', 1)
          s = s.replace('Stepper("浮窗最大宽度：\\(Int(preferences.value.maximumWidth)) pt", value: $preferences.value.maximumWidth, in: 90...360, step: 10)',
                        'numberField("浮窗最大宽度", value: $preferences.value.maximumWidth, range: 90...360, suffix: "pt")', 1)
          s = s.replace('appearanceSlider("下拉面板背景透明度", value: $preferences.value.panelTransparency, range: 0...0.65)\n            Button("恢复外观默认设定", action: resetAppearanceDefaults)',
                        'appearanceSlider("下拉面板背景透明度", value: $preferences.value.panelTransparency, range: 0...0.65)\n            numberField("HUD 圆角", value: Binding(get: { preferences.value.cornerRadius }, set: { preferences.value.cornerRadius = $0 }), range: 0...24, suffix: "pt")\n            Button("恢复外观默认设定", action: resetAppearanceDefaults)', 1)
          marker = '    private var sourceSection: some View {'
          end_marker = '    private var layoutSection: some View {'
          if marker not in s or end_marker not in s:
              raise SystemExit('HUDLayoutEditorView: source/layout section markers missing')
          start = s.index(marker)
          end = s.index(end_marker)
          helper = '''    private func numberField(_ title: String, value: Binding<Double>, range: ClosedRange<Double>, suffix: String) -> some View {
                  HStack(spacing: 8) {
                      Text(title)
                      Spacer()
                      TextField("", value: Binding(get: { value.wrappedValue }, set: { value.wrappedValue = min(range.upperBound, max(range.lowerBound, $0)) }), format: .number.precision(.fractionLength(0)))
                          .multilineTextAlignment(.trailing)
                          .frame(width: 72)
                      Text(suffix).foregroundStyle(.secondary)
                  }
              }
          '''
          s = s[:start] + helper + s[end:]

          old_prefix = '''    private var layoutSection: some View {
                  Section {
                      HStack {
          '''
          new_prefix = '''    private var layoutSection: some View {
                  Section {
                      Picker("当前数据源（新增控件绑定）", selection: $preferences.value.sourceID) {
                          ForEach(bindableSources) { source in Text(source.label).tag(source.id) }
                          if !bindableSources.contains(where: { $0.id == preferences.value.sourceID }) {
                              Text("已移除的数据源").tag(preferences.value.sourceID)
                          }
                      }
                      if preferences.value.sourceID == "legacy" {
                          Picker("兼容来源", selection: legacySource) {
                              ForEach(NotchDisplaySource.allCases) { Text($0.label).tag($0) }
                          }
                      }
                      Toggle("百分比显示剩余（关闭后显示已用）", isOn: $preferences.value.showRemaining)
                      Text("点击或拖入的新控件会直接绑定到当前数据源；以后切换这里的来源不会改掉已绑定控件。已放置控件仍可右键重新绑定。左侧 RUN / IDLE 始终只反映本机 Codex。")
                          .font(.caption).foregroundStyle(.secondary)
                      Divider()
                      HStack {
          '''
          if old_prefix not in s:
              raise SystemExit('HUDLayoutEditorView: layout prefix missing')
          s = s.replace(old_prefix, new_prefix, 1)

          old_scope = '''                Picker("布局作用域", selection: $scope) {
                              Text("所有来源（默认）").tag("all"); Text("Codex 默认").tag("codex")
                              ForEach(accounts.accounts) { account in Text("Codex · \\(account.label)").tag(account.hudID) }
                              Text("网关账户").tag("gateway"); Text("NewAPI").tag("newapi:"); Text("Sub2API").tag("subapi:")
                          }
          '''
          new_scope = '''                Picker("布局作用域", selection: $scope) {
                              Text("全部来源 · 默认布局").tag("all")
                              Text("本机 Codex · 独立布局").tag("local")
                              Text("Codex 账号 · 类型默认").tag("codex")
                              ForEach(accounts.accounts) { account in Text("Codex · \\(account.label)").tag(account.hudID) }
                              Text("网关 · 类型默认").tag("gateway")
                              ForEach(remote.snapshot.accounts) { account in Text("网关 · \\(account.displayName)").tag("remote:\\(account.id)") }
                              Text("NewAPI · 类型默认").tag("newapi:")
                              ForEach(newAPI.snapshot.accounts) { account in Text("NewAPI · \\(account.displayName)").tag("newapi:\\(account.id)") }
                              Text("Sub2API · 类型默认").tag("subapi:")
                              ForEach(subAPI.snapshot.accounts) { account in Text("Sub2API · \\(account.displayName)").tag("subapi:\\(account.id)") }
                          }
          '''
          if old_scope not in s:
              raise SystemExit('HUDLayoutEditorView: scope picker block missing')
          s = s.replace(old_scope, new_scope, 1)
          s = s.replace('Button("紧凑额度") { save(.compact) }; Button("用量和重置") { save(.detailed) }\n                    Button("余额和费用") { save(.costs) }',
                        'Button("紧凑额度") { save(boundPreset(.compact)) }; Button("用量和重置") { save(boundPreset(.detailed)) }\n                    Button("余额和费用") { save(boundPreset(.costs)) }', 1)
          s = s.replace('Text("左侧为固定区域，不参与拖动。右侧控件可分别绑定不同账号，也可为每个 Codex 账号保存独立布局；每行最多 12 个控件、最多 2 行，空格和分隔点可以重复添加。")\n                .font(.caption).foregroundStyle(.secondary)',
                        'Text(scopeHelp)\n                .font(.caption).foregroundStyle(.secondary)\n            Text("布局作用域只决定使用哪套控件排列；控件自己的数据源由绑定决定。每行最多 12 个控件、最多 2 行，空格和分隔点可以重复添加。")\n                .font(.caption).foregroundStyle(.secondary)', 1)
          s = s.replace('.background(Color.black.opacity(0.985), in: RoundedRectangle(cornerRadius: 5))',
                        '.background(Color.black.opacity(preferences.value.normalized.hudOpacity), in: RoundedRectangle(cornerRadius: CGFloat(preferences.value.cornerRadius), style: .continuous))', 1)
          s = s.replace('var values: [HUDBindableSource] = [.init(id: "local", label: "本机 Codex")]',
                        'var values: [HUDBindableSource] = [.init(id: "local", label: "本机 Codex"), .init(id: "legacy", label: "旧版自动来源")]', 1)
          s = s.replace('preferences.value.hudOpacity = 0.985\n        preferences.value.panelOpacity = 0.985',
                        'preferences.value.hudOpacity = 0.90\n        preferences.value.panelOpacity = 0.90\n        preferences.value.cornerRadius = 10', 1)
          s = s.replace('else { save(next.addingConditional(rule, id: draft.id)) }',
                        'else { save(next.addingConditional(rule, id: draft.id, sourceID: preferences.value.sourceID)) }', 1)
          s = s.replace('else { save(layout.inserting(metric, row: layout.lines.count - 1)) }',
                        'else { save(layout.inserting(metric, row: layout.lines.count - 1, sourceID: preferences.value.sourceID)) }', 1)
          s = s.replace('Button("跟随默认数据源") { save(layout.settingSource(nil, at: p)) }',
                        'Button("解除绑定（跟随当前数据源）") { save(layout.settingSource(nil, at: p)) }', 1)
          s = s.replace('var next = layout.inserting(metric, row: row)',
                        'var next = layout.inserting(metric, row: row, sourceID: preferences.value.sourceID)', 1)

          anchor = '''    private func sourceLabel(_ id: String) -> String {
                  bindableSources.first(where: { $0.id == id })?.label ?? "已移除的数据源"
              }
          '''
          helpers = anchor + '''    private var scopeHelp: String {
                  if scope == "all" { return "默认布局：当前数据源没有更具体的布局时使用。多账号混排最适合在这里编辑。" }
                  if scope == "local" { return "本机 Codex 独立布局：当前数据源为本机 Codex 时优先于默认布局。" }
                  if scope == "codex" { return "Codex 类型默认：远程 Codex 账号没有账号专属布局时使用。" }
                  if scope == "gateway" { return "网关类型默认：当前数据源为任意网关账号、且没有该账号专属布局时使用。" }
                  if scope == "newapi:" { return "NewAPI 类型默认：当前数据源为任意 NewAPI 账号、且没有该账号专属布局时使用。" }
                  if scope == "subapi:" { return "Sub2API 类型默认：当前数据源为任意 Sub2API 账号、且没有该账号专属布局时使用。" }
                  return "账号专属布局：仅当当前数据源为「\\(sourceLabel(scope))」时优先使用。"
              }
              private func boundPreset(_ preset: HUDLayout) -> HUDLayout {
                  var next = preset.normalized
                  for row in next.lines.indices {
                      for index in next.lines[row].indices {
                          next = next.settingSource(preferences.value.sourceID, at: .init(row: row, index: index))
                      }
                  }
                  return next.normalized
              }
          '''
          if anchor not in s:
              raise SystemExit('HUDLayoutEditorView: helper anchor missing')
          s = s.replace(anchor, helpers, 1)
          editor.write_text(s)

          # 版本和回归断言。
          Path('VERSION').write_text('0.4.3\n')
          app = Path('Sources/CodexNotch/AppInfo.swift')
          t = app.read_text()
          if '0.4.2' not in t: raise SystemExit('AppInfo old version missing')
          app.write_text(t.replace('0.4.2', '0.4.3'))
          reg = Path('Tests/CodexNotchRegressionTests/main.swift')
          t = reg.read_text()
          if '0.4.2' not in t: raise SystemExit('regression old version missing')
          reg.write_text(t.replace('0.4.2', '0.4.3'))

          # 新增针对外观默认值和逐控件绑定的回归。
          Path('Tests/CodexNotchTests/HUDAppearanceBindingTests.swift').write_text(r'''import Foundation
          import Testing
          @testable import CodexNotch

          @Test func hudAppearanceDefaultsUseTenPercentTransparencyAndCustomRadius() {
              let value = HUDConfiguration()
              #expect(abs(value.hudTransparency - 0.10) < 0.0001)
              #expect(abs(value.panelTransparency - 0.10) < 0.0001)
              #expect(value.cornerRadius == 10)
              var malformed = value
              malformed.hudCornerRadius = 99
              #expect(malformed.normalized.cornerRadius == 24)
              malformed.hudCornerRadius = -4
              #expect(malformed.normalized.cornerRadius == 0)
          }

          @Test func insertedHUDControlsBindToSelectedSourceAndCanCoexist() {
              var layout = HUDLayout(lines: [[]])
              layout = layout.inserting(.weekly, row: 0, sourceID: "remote:gateway-a")
              layout = layout.inserting(.weekly, row: 0, sourceID: "remote:gateway-b")
              #expect(layout.lines[0].count == 2)
              #expect(HUDLayoutToken.sourceID(layout.lines[0][0]) == "remote:gateway-a")
              #expect(HUDLayoutToken.sourceID(layout.lines[0][1]) == "remote:gateway-b")
              layout = layout.inserting(.space, row: 0, sourceID: "remote:gateway-a")
              #expect(HUDLayoutToken.sourceID(layout.lines[0].last ?? "") == nil)
          }

          @Test func conditionalHUDControlCanBindToAnAccount() {
              let layout = HUDLayout(lines: [[]]).addingConditional(.init(), sourceID: "codex-account:00000000-0000-0000-0000-000000000001")
              #expect(HUDLayoutToken.sourceID(layout.lines[0][0]) == "codex-account:00000000-0000-0000-0000-000000000001")
          }
          ''')
          PY
          git rm .github/workflows/validate-hud-043.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE="$(printf '%s\n' 'feat: simplify HUD source binding and appearance controls' | git commit-tree "$(git write-tree)" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-hud-043 "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 全量测试、原生截图与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -240 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "0.4.3"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-hud-043
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hud-043-native
          path: |
            .baseline-output/
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-hud-043
          path: ${{ runner.temp }}/validated/
          retention-days: 2
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-hud-043
          path: ${{ runner.temp }}/validated
      - name: 发布已验证功能分支
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-hud-043:refs/remotes/validated/hud-043
          test "$(git ls-remote origin refs/heads/feat/hud-layout-sources-043-20260911 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/feat/hud-layout-sources-043-20260911"
