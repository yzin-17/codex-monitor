name: 远程来源与浏览器授权验证
on:
  push:
    branches: [fix/remote-hud-ux-20260910]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 读取已保存的本轮源码补丁
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui "$RUNNER_TEMP/validated"
          python3 - <<'PY'
          import base64,json,lzma,os,urllib.request
          from pathlib import Path
          parts=[]
          for sha in ['3d5c98f0cff0f42a7c5ef4b14513f0ee15fc65f0','9f64caa2a512833908b26de55b7f0d510c2c7c87','3da6018c1daf820681d1a76355e3c5736e5350a8']:
              req=urllib.request.Request('https://api.github.com/repos/yzin-17/codex-monitor/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              obj=json.load(urllib.request.urlopen(req,timeout=25))
              parts.append(base64.b64decode(obj['content']).decode().strip())
          raw=''.join(parts)
          patch=lzma.decompress(base64.b64decode(raw))
          assert patch.startswith(b'diff --git ')
          Path(os.environ['RUNNER_TEMP'],'remote-ux.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/remote-ux.patch"
          git apply --index "$RUNNER_TEMP/remote-ux.patch"
          if test -f tools/remote-ux-fixes.py; then python3 tools/remote-ux-fixes.py; git rm tools/remote-ux-fixes.py; fi
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE="$(printf '%s\n' 'fix: unify remote sources, browser authorization and HUD dimensions' | git commit-tree "$(git write-tree)" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-remote-ux "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 回归与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        run: |
          set -euo pipefail
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -160 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-remote-ux
      - name: 只读检查拟接入的公开数据格式
        if: always()
        run: |
          python3 - <<'PY'
          import urllib.request,json
          from pathlib import Path
          root=Path('.baseline-output/public');root.mkdir(parents=True,exist_ok=True)
          urls={'openai.json':'https://status.openai.com/api/v2/summary.json','observatory.json':'https://codex.gussuriworks.com/api/current?locale=zh','will.json':'https://www.willcodexquotareset.com/api/forecast'}
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'CodexMonitor-public-integration-check/0.4','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r: data=r.read(2*1024*1024+1)
                  if len(data)>2*1024*1024: raise ValueError('response too large')
                  json.loads(data)
                  (root/name).write_bytes(data)
                  print(name, len(data))
              except Exception as e:print(name, type(e).__name__)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-ux-native
          path: |
            .baseline-output/
            dist/*.dmg
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-remote-ux
          path: ${{ runner.temp }}/validated/
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-remote-ux
          path: ${{ runner.temp }}/validated
      - name: 发布已验证的功能分支
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-remote-ux:refs/remotes/validated/remote-ux
          test "$(git ls-remote origin refs/heads/fix/remote-hud-ux-20260910 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/fix/remote-hud-ux-20260910"
