name: 0.4.2 UI 与逐控件账号绑定回归
on:
  push:
    branches: [feat/ui-polish-042-20260911]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 应用 0.4.2 源码补丁
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui "$RUNNER_TEMP/validated"
          cat .github/patches/ui-polish-042.part0 .github/patches/ui-polish-042.part1 .github/patches/ui-polish-042.part2 \
            | base64 --decode | xz -dc > "$RUNNER_TEMP/ui-042.patch"
          git apply --check --index "$RUNNER_TEMP/ui-042.patch"
          git apply --index "$RUNNER_TEMP/ui-042.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/CodexNotch/AppDelegate.swift')
          s = p.read_text()
          needle = 'dataForRaw: { raw in'
          if s.count(needle) != 2:
              raise SystemExit(f'expected 2 AppDelegate HUD resolver closures, found {s.count(needle)}')
          p.write_text(s.replace(needle, 'dataForRaw: { [self] raw in'))

          p = Path('Tests/CodexNotchRegressionTests/main.swift')
          s = p.read_text()
          if '0.4.1' not in s:
              raise SystemExit('no remaining 0.4.1 regression assertion found')
          p.write_text(s.replace('0.4.1', '0.4.2'))
          PY
          git rm .github/patches/ui-polish-042.part0 .github/patches/ui-polish-042.part1 .github/patches/ui-polish-042.part2 .github/workflows/validate-ui-042.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE="$(printf '%s\n' 'feat: polish UI, restore visual defaults and bind HUD controls per account' | git commit-tree "$(git write-tree)" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-ui-042 "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 全量测试、原生截图与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -240 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "0.4.2"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ui-042
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-042-native
          path: |
            .baseline-output/
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-ui-042
          path: ${{ runner.temp }}/validated/
          retention-days: 2
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-ui-042
          path: ${{ runner.temp }}/validated
      - name: 发布已验证功能分支
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ui-042:refs/remotes/validated/ui-042
          test "$(git ls-remote origin refs/heads/feat/ui-polish-042-20260911 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/feat/ui-polish-042-20260911"
