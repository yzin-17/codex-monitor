name: 0.4.1 UX 与多账户回归
on:
  push:
    branches: [feat/ux-multi-account-review-20260911]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 应用已保存的 0.4.1 源码补丁
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui "$RUNNER_TEMP/validated"
          python3 - <<'PY'
          import base64,json,lzma,os,urllib.request
          from pathlib import Path
          chunks=[]
          for sha in ['ceafba651f19df3dac25e4d5db9af40faaf0a56c','ad1eafb5ab93d13aabfa1dc098a578da1083c20d','a3eabf8811cc45f12b956493483e6a75e6a415c1']:
              req=urllib.request.Request('https://api.github.com/repos/yzin-17/codex-monitor/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              obj=json.load(urllib.request.urlopen(req,timeout=30))
              chunks.append(base64.b64decode(obj['content']).decode().strip())
          encoded=''.join(chunks)
          patch=lzma.decompress(base64.b64decode(encoded))
          assert patch.startswith(b'diff --git ')
          Path(os.environ['RUNNER_TEMP'],'ux-041.patch').write_bytes(patch)
          print('patch bytes',len(patch))
          PY
          git apply --check --index "$RUNNER_TEMP/ux-041.patch"
          git apply --index "$RUNNER_TEMP/ux-041.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE="$(printf '%s\n' 'feat: refine conversations, HUD accounts, predictions and CLI resume UX' | git commit-tree "$(git write-tree)" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-ux-041 "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 全量测试、原生截图与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -220 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "0.4.1"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ux-041
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ux-041-native
          path: |
            .baseline-output/
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-ux-041
          path: ${{ runner.temp }}/validated/
          retention-days: 2
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-ux-041
          path: ${{ runner.temp }}/validated
      - name: 快进已验证功能分支
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ux-041:refs/remotes/validated/ux-041
          test "$(git ls-remote origin refs/heads/feat/ux-multi-account-review-20260911 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/feat/ux-multi-account-review-20260911"
