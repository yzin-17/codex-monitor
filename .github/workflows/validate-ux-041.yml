name: 0.4.1 UX 与多账户回归
on:
  push:
    branches: [feat/ux-multi-account-review-20260911]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 应用已保存的 0.4.1 源码补丁
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .baseline-output/ui "$RUNNER_TEMP/validated"
          python3 - <<'PY'
          import base64,json,lzma,os,urllib.request
          from pathlib import Path
          chunks=[]
          for sha in ['ceafba651f19df3dac25e4d5db9af40faaf0a56c','ad1eafb5ab93d13aabfa1dc098a578da1083c20d','a3eabf8811cc45f12b956493483e6a75e6a415c1']:
              req=urllib.request.Request('https://api.github.com/repos/yzin-17/codex-monitor/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              obj=json.load(urllib.request.urlopen(req,timeout=30))
              chunks.append(base64.b64decode(obj['content']).decode().strip())
          patch=lzma.decompress(base64.b64decode(''.join(chunks)))
          assert patch.startswith(b'diff --git ')
          Path(os.environ['RUNNER_TEMP'],'ux-041.patch').write_bytes(patch)
          print('patch bytes',len(patch))
          PY
          git apply --check --index "$RUNNER_TEMP/ux-041.patch"
          git apply --index "$RUNNER_TEMP/ux-041.patch"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/CodexNotch/AppDelegate.swift')
          s=p.read_text(); needle='final class NotchOverlayController {'
          if '@MainActor\n'+needle not in s: s=s.replace(needle,'@MainActor\n'+needle,1)
          p.write_text(s)
          p=Path('Sources/CodexNotch/HUDDisplayData.swift')
          s=p.read_text()
          replacements={
              'case .weekly, .weeklyPace, .weeklyCountdown, .weeklyResetTime: weeklyWindow ?? .init(remaining: weekly, label: "7d")':'case .weekly, .weeklyPace, .weeklyCountdown, .weeklyResetTime: return weeklyWindow ?? .init(remaining: weekly, label: "7d")',
              'case .scopedWeekly, .scopedPace, .scopedCountdown, .scopedResetTime: scopedWindow':'case .scopedWeekly, .scopedPace, .scopedCountdown, .scopedResetTime: return scopedWindow',
              'case .primaryLane: lanes.first':'case .primaryLane: return lanes.first',
              'case .secondaryLane: lanes.count > 1 ? lanes[1] : nil':'case .secondaryLane: return lanes.count > 1 ? lanes[1] : nil',
              'case .tertiaryLane: lanes.count > 2 ? lanes[2] : nil':'case .tertiaryLane: return lanes.count > 2 ? lanes[2] : nil',
              'default: automaticWindow ?? .init(remaining: automatic, resetsAt: resetsAt, label: "自动")':'default: return automaticWindow ?? .init(remaining: automatic, resetsAt: resetsAt, label: "自动")',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          p=Path('Tests/CodexNotchTests/PublicInsightsTests.swift')
          s=p.read_text().replace('@Test @MainActor func forecastAlertNeedsFreshEnabledProbabilityStrictlyAboveSeventy() throws {','@Test @MainActor func forecastAlertNeedsFreshEnabledProbabilityStrictlyAboveSeventy() async throws {')
          p.write_text(s)
          p=Path('Tests/CodexNotchTests/ReferenceExtensionTests.swift')
          s=p.read_text().replace('remote: remote, newAPI: newAPI, subAPI: subAPI, settings: settings, menuBar: true)','remote: remote, newAPI: newAPI, subAPI: subAPI, settings: settings, publicInsights: usage.publicInsights, menuBar: true)')
          p.write_text(s)
          PY
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE="$(printf '%s\n' 'feat: refine conversations, HUD accounts, predictions and CLI resume UX' | git commit-tree "$(git write-tree)" -p "$GITHUB_SHA")"
          git update-ref refs/heads/validated-ux-041 "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/validated/candidate.txt"
      - name: macOS 全量测试、原生截图与双架构构建
        env:
          CODEX_MONITOR_SNAPSHOT_DIR: ${{ github.workspace }}/.baseline-output/ui
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh > .baseline-output/build.log 2>&1 || { tail -220 .baseline-output/build.log; exit 1; }
          grep -E 'Test run with|All regression|Built |error:' .baseline-output/build.log || true
          codesign --verify --deep --strict dist/CodexMonitor.app
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "0.4.1"
          test -s "dist/codex-monitor-$VERSION-arm64.dmg"
          test -s "dist/codex-monitor-$VERSION-amd64.dmg"
          git bundle create "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ux-041
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ux-041-native
          path: |
            .baseline-output/
            dist/*.dmg
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-ux-041
          path: ${{ runner.temp }}/validated/
          retention-days: 2
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-ux-041
          path: ${{ runner.temp }}/validated
      - name: 快进已验证功能分支
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(cat "$RUNNER_TEMP/validated/candidate.txt")"
          git fetch "$RUNNER_TEMP/validated/candidate.bundle" refs/heads/validated-ux-041:refs/remotes/validated/ux-041
          test "$(git ls-remote origin refs/heads/feat/ux-multi-account-review-20260911 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$CANDIDATE:refs/heads/feat/ux-multi-account-review-20260911"
